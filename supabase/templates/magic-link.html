<!--
  Supabase > Authentication > Emails > Templates > "Magic Link"
  Assunto: Seu acesso à Área de Membros · Método da Aprovação
  Cole o HTML abaixo no corpo (Source).
-->
<div style="background:#09090B;padding:32px 16px;font-family:Segoe UI,Arial,sans-serif;color:#FAFAFA">
  <div style="max-width:460px;margin:0 auto;background:#141417;border:1px solid #26262B;border-radius:14px;padding:32px;text-align:center">
    <p style="margin:0 0 4px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#F6C111;font-weight:700">Método da Aprovação</p>
    <h1 style="margin:0 0 12px;font-size:22px">Seu acesso chegou</h1>
    <p style="margin:0 0 24px;color:#A1A1AA;font-size:15px;line-height:1.5">Clique no botão para entrar na Área de Membros.</p>

    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email"
       style="display:inline-block;background:#F6C111;color:#111;text-decoration:none;font-weight:700;padding:14px 28px;border-radius:10px">
      Entrar na Área de Membros
    </a>

    <p style="margin:28px 0 8px;color:#A1A1AA;font-size:14px">Ou digite este código na tela de login:</p>
    <p style="margin:0;font-size:30px;font-weight:700;letter-spacing:.3em;color:#FAFAFA">{{ .Token }}</p>

    <p style="margin:28px 0 0;color:#71717A;font-size:12px;line-height:1.5">O link e o código valem por pouco tempo e só podem ser usados uma vez.<br>Se você não pediu este acesso, é só ignorar este e-mail.</p>
  </div>
</div>
